version: "2"
run:
  tests: true
linters:
  default: none
  enable: &enabled-linters
    - asciicheck
    - bodyclose
    - cyclop
    - depguard
    - dogsled
    - dupl
    - durationcheck
    - err113
    - errcheck
    - errorlint
    - exhaustive
    - forbidigo
    - forcetypeassert
    - funlen
    - gochecknoglobals
    - gochecknoinits
    - gocognit
    - goconst
    - gocritic
    - gocyclo
    - godot
    - goheader
    - gomoddirectives
    - gomodguard
    - goprintffuncname
    - gosec
    - govet
    - ineffassign
    - lll
    - makezero
    - misspell
    - mnd
    - nakedret
    - nestif
    - nilerr
    - nlreturn
    - noctx
    - nolintlint
    - paralleltest
    - prealloc
    - predeclared
    - promlinter
    - revive
    - rowserrcheck
    - sqlclosecheck
    - staticcheck
    - tagliatelle
    - testpackage
    - thelper
    - tparallel
    - unconvert
    - unparam
    - unused
    - wastedassign
    - whitespace
    - wrapcheck
  settings:
    depguard:
      rules:
        # v1 configured no import restrictions; retain that policy in v2.
        Main:
          list-mode: lax
          files: ["$all"]
          allow: ["$gostd"]
    govet:
      enable: [shadow]
    gosec:
      config:
        global:
          audit: true
    errcheck:
      check-type-assertions: true
      check-blank: true
    gocritic:
      disabled-checks:
        - commentedOutCode
      enabled-tags:
        - diagnostic
        - experimental
        - opinionated
        - performance
        - style
    whitespace:
      multi-if: true
      multi-func: true
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      # Keep test-linter findings excluded while formatters cover test files.
      - path: '_test\.go$'
        linters: *enabled-linters
      - linters:
          - lll
        source: '^//go:generate '
    paths:
      - swagger/
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
    - goimports
  settings:
    gci:
      sections: [standard, default, prefix(gitlab.com/crusoeenergy)]
    goimports:
      local-prefixes:
        - gitlab.com/crusoeenergy
  exclusions:
    generated: lax
    paths:
      - swagger/
      - third_party$
      - builtin$
      - examples$
