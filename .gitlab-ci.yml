include:
  - component: $CI_SERVER_FQDN/crusoeenergy/tools/mise@master
  - component: $CI_SERVER_FQDN/crusoeenergy/tools/go@master
    inputs:
      major_version: "$MAJOR_VERSION"
      minor_version: "$MINOR_VERSION"

variables:
  MAJOR_VERSION: "1"
  MINOR_VERSION: "0"

# Retain the meaningful v1-only checks alongside the standard v2 lint job.
legacy_lint_checks:
  extends: .go_rules
  stage: test
  rules: !reference [golangci_lint, rules]
  script:
    - mise run lint:legacy-checks
