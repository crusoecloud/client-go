include:
  - component: $CI_SERVER_FQDN/crusoeenergy/tools/mise@master
  - component: $CI_SERVER_FQDN/crusoeenergy/tools/go@master
    inputs:
      major_version: "$MAJOR_VERSION"
      minor_version: "$MINOR_VERSION"

variables:
  MAJOR_VERSION: "1"
  MINOR_VERSION: "0"
  # The retained standalone reminder/promotion jobs use the existing helper image.
  CI_IMAGE: registry.gitlab.com/crusoeenergy/tools/go-ci-1.18
  CI_IMAGE_TAG: master
  AST_ENABLE_MR_PIPELINES: 'true'
  SAST_EXCLUDED_ANALYZERS: gosec,semgrep
  GITLAB_ADVANCED_SAST_ENABLED: 'true'

.code-changes: &code-changes
      changes:
        - .gitlab-ci.yml
        - Makefile
        - go.*

# Preserve the informational source index while shared Go jobs use mise.
code_intelligence:
  needs: []
  allow_failure: true
  image: registry.gitlab.com/crusoeenergy/tools/scip:v0.5.0
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes: !reference [.code-changes, changes]
  before_script:
    - go env -w "GOPRIVATE=${CI_SERVER_HOST}"
    - echo "machine ${CI_SERVER_HOST} login gitlab-ci-token password ${CI_JOB_TOKEN}" > ~/.netrc
  script:
    - scip-go --skip-tests
    - scip convert --from index.scip --to dump.lsif
  artifacts:
    reports:
      lsif: dump.lsif

# The existing dependency reminder remains separate from the shared QA jobs.
dependency-reminders:
  image: $CI_IMAGE:$CI_IMAGE_TAG
  needs: []
  rules:
    - if: '$CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "staging" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "prod"'
      when: never
    - if: '$CI_MERGE_REQUEST_ID && $CI_API_TOKEN'
      changes: [go.mod, go.sum]
  script:
    - /var/crusoe/scripts/dependency_reminder.sh

# Retain the meaningful v1-only checks alongside the standard v2 lint job.
legacy_lint_checks:
  extends: .go_rules
  stage: test
  rules: !reference [golangci_lint, rules]
  script:
    - mise run lint:legacy-checks

format_lint:
  extends: .go_rules
  stage: test
  rules: !reference [golangci_lint, rules]
  script:
    - mise run go:lint:fmt -- --diff ./...
